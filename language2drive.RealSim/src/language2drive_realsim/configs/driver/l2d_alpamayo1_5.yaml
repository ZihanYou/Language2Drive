# Language-conditioned Alpamayo 1.5 driver for the paired RealSim benchmark.
# The shared upstream preset supplies the exact four-camera runtime contract.

defaults:
  - alpamayo_configs
  - _self_

log_level: ${wizard.log_level}

model:
  model_type: l2d_alpamayo1_5
  # Reuse an existing read-only snapshot on hosts that set this variable;
  # otherwise fall back to the gated Hugging Face model ID.
  checkpoint_path: "${oc.env:L2D_ALPAMAYO_CHECKPOINT,nvidia/Alpamayo-1.5-10B}"
  device: "cuda"
  # Coupled arm comparisons require repeatable inference for a given seed.
  force_determinism: true
  image_decode_device: cuda
  num_trajectory_samples: 1
  trajectory_selection:
    strategy: ALWAYS_FIRST
    max_num_distance_points: 64
    skip_first_n_distance_points: 0

host: "0.0.0.0"
port: ???

inference:
  use_cameras:
    - camera_cross_left_120fov
    - camera_front_wide_120fov
    - camera_cross_right_120fov
    - camera_front_tele_30fov
  max_batch_size: 1
  subsample_factor: 1
  context_length: 4

# No route-derived waypoint command or navigation text may enter the model.
route:
  use_waypoint_commands: false

output_dir: "/mnt/output/driver"

trajectory_optimizer:
  enabled: false

plot_debug_images: false
