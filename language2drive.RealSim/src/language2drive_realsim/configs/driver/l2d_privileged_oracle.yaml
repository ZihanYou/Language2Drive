# CPU-only privileged path follower for oracle qualification. Never use this
# driver as a benchmark model baseline.

defaults:
  - alpamayo_configs
  - _self_

log_level: ${wizard.log_level}

model:
  model_type: l2d_privileged_oracle
  checkpoint_path: "unused"
  device: "cpu"
  image_decode_device: "cpu"

host: "0.0.0.0"
port: ???

inference:
  use_cameras:
    - camera_cross_left_120fov
    - camera_front_wide_120fov
    - camera_cross_right_120fov
    - camera_front_tele_30fov
  max_batch_size: 1
  subsample_factor: 1
  context_length: 1
  output_frequency_hz: 10

route:
  use_waypoint_commands: false

output_dir: "/mnt/output/oracle-driver"

trajectory_optimizer:
  enabled: false

plot_debug_images: false
