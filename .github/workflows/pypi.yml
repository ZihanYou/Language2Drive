name: Publish PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build '.[openloop]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
      - run: python scripts/check_wheel.py dist/language2drive-0.1.0-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/*.whl
  publish:
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/language2drive
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
